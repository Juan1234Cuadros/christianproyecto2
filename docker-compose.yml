services:
  api:
    build: .
    container_name: flask-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - proxy-network

  db:
    image: mysql:8.0
    container_name: servidor-bd-ejemplo
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - proxy-network
    # El puerto 3306 NO se publica al host a propósito: solo es
    # alcanzable dentro de la red interna de Docker (por 'api' y,
    # más adelante, por Uptime Kuma para el monitor TCP).

volumes:
  mysql_data:

networks:
  proxy-network:
    external: true
